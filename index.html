<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaaS Atlas — Visual UX Reference Library</title>
<meta name="description" content="Реальные скриншоты SaaS, визуальные UX-разборы, навигация по паттернам и машиночитаемые источники.">
<style>
:root{--bg:#f8f7f6;--paper:#fff;--ink:#28252f;--muted:#817d88;--line:#e9e6ea;--purple:#74618b;--lav:#f0ecf5;--dark:#352d3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}button,input{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}a{color:inherit}a:hover{color:var(--purple)}:focus-visible{outline:3px solid #af96cf;outline-offset:3px}
#app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar{background:#faf9fa;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 15px}.brand{display:flex;align-items:center;gap:10px;padding:2px 12px 27px;cursor:pointer}.mark{height:35px;width:35px;background:var(--purple);border-radius:10px;color:white;display:grid;place-items:center;font-size:22px}.brand b{font-size:18px;letter-spacing:-.6px}.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:#9f97a7}.sidehead{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:#998d9e;font-weight:800;padding:14px 12px 10px}.sidebtn{width:100%;text-align:left;padding:10px 12px;border-radius:9px;color:#645b69;display:flex;justify-content:space-between;gap:10px}.sidebtn:hover,.sidebtn.active{background:var(--lav);color:#4b385a}.count{color:#9c93a2}.sidefoot{font-size:11px;color:var(--muted);padding:22px 12px;line-height:1.8}
.main{min-width:0;padding:24px clamp(19px,3.3vw,54px) 75px;max-width:1750px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:26px;color:#918b94;font-size:12px}.top a{margin-left:14px;color:#74618b;text-decoration:none}.eyebrow{font-weight:750;text-transform:uppercase;color:#9783a6;letter-spacing:1.8px;font-size:11px}.hero h1{font-size:clamp(34px,4.7vw,62px);letter-spacing:-2.2px;line-height:1.08;margin:14px 0}.hero em{font-style:normal;color:#957dab}.hero p{max-width:690px;color:#716b76;font-size:15px}.metrics{display:flex;gap:25px;padding:23px 0 25px;border-bottom:1px solid var(--line);margin-bottom:23px}.metric b{font-size:25px;display:block;letter-spacing:-1px}.metric small{font-size:11px;color:var(--muted)}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:15px 0 22px}.search{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 14px;width:min(100%,420px);outline:0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.chip{padding:7px 11px;border:1px solid var(--line);background:#fff;border-radius:100px;color:#776d7e;font-size:12px}.chip.active,.chip:hover{background:var(--lav);border-color:#d9cae2;color:#6d527c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}.tile{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;min-width:0}.tile:hover{box-shadow:0 8px 24px #4a2e5210}.preview{position:relative;background:#f2f0f1;aspect-ratio:1.56;cursor:pointer;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}.labelimg{position:absolute;left:12px;top:12px;font-size:10px;background:#fffc;padding:5px 8px;border-radius:7px}.tilebody{padding:17px 18px}.small{font-size:11px;color:var(--muted)}.tilename{display:flex;justify-content:space-between;gap:10px;color:#7a7180}.tile h3{font-size:18px;letter-spacing:-.4px;line-height:1.25;margin:10px 0}.tile p{color:#79737d;line-height:1.6;font-size:12px;min-height:40px}.tilefoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}.tag{font-size:11px;color:#846e98;background:#f3eff6;border-radius:7px;padding:5px 7px}.btn{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:white;font-size:12px;color:#6b5d73;text-decoration:none}.btn:hover{border-color:#bfadd1;color:#493754}.btn.primary{background:var(--purple);border-color:var(--purple);color:white}
.crumb{color:var(--muted);font-size:12px;margin:3px 0 23px}.crumb button{color:var(--purple)}.detailhead{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}.detailhead h1{font-size:clamp(27px,3vw,42px);letter-spacing:-1.3px;line-height:1.1;margin:7px 0 9px}.detailhead p{color:var(--muted);margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.tabs{display:flex;gap:9px;overflow-x:auto;padding-bottom:16px}.tab{min-width:150px;background:white;border:1px solid var(--line);border-radius:12px;padding:14px 15px;text-align:left;font-size:13px;white-space:normal;line-height:1.35}.tab small{color:#a08da9;display:block;font-size:10px;padding-bottom:4px}.tab.active{border-color:#9f86b7;background:#f5f1f7;box-shadow:0 0 0 1px #b7a0c9 inset}
.detailgrid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(270px,.9fr);gap:18px}.viewer{border:1px solid var(--line);border-radius:17px;background:white;overflow:hidden}.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}.vhead strong{font-size:12px}.canvas{position:relative;overflow:hidden;background:#f4f2f4;display:grid;place-items:center}.canvas img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;cursor:zoom-in}.focus{position:absolute;border:2px solid #9e72cb;border-radius:9px;pointer-events:none;background:#ac84d31a;box-shadow:0 0 0 5000px #fff1}.focus.left{left:1%;top:3%;height:94%;width:23%}.focus.top-left{left:0;top:0;width:50%;height:31%}.focus.top{left:12%;top:1%;width:78%;height:25%}.focus.right{right:1%;top:4%;width:28%;height:91%}.focus.center{left:25%;top:15%;width:55%;height:70%}.focus.bottom{left:9%;bottom:2%;width:82%;height:30%}.focus.all{inset:5%}.caption{padding:12px 16px;border-top:1px solid var(--line);color:#8c8490;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:12px}.caption a{color:#7a5f92}.notes{display:flex;flex-direction:column;gap:13px}.note{background:white;border:1px solid var(--line);border-radius:16px;padding:19px 20px}.note.first{background:#f1edf5}.note .eyebrow{font-size:10px}.note h3{font-size:19px;letter-spacing:-.5px;line-height:1.3;margin:9px 0}.note p{color:#746d78;margin:8px 0 0;line-height:1.65;font-size:13px}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px}.footer{margin-top:65px;border-top:1px solid var(--line);padding-top:20px;font-size:12px;color:var(--muted)}.none{padding:30px;color:#817681;text-align:center}.modal{position:fixed;inset:0;background:#15101de6;z-index:30;display:none;flex-direction:column;padding:19px;gap:13px}.modal.show{display:flex}.modalhead{display:flex;justify-content:space-between;align-items:center;color:white}.modalhead button{color:white;font-size:24px}.modal img{max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;margin:auto}.mobileBrand{display:none}.notice{font-size:11px;color:#8a7f8d;margin:17px 0}
@media(max-width:1000px){.detailgrid{grid-template-columns:1fr}.notes{display:grid;grid-template-columns:repeat(2,1fr)}}@media(max-width:690px){#app{display:block}.sidebar{display:none}.mobileBrand{display:block;padding:12px 18px;border-bottom:1px solid var(--line)}.main{padding:19px 15px 60px}.top{flex-wrap:wrap}.top a{margin-left:0;margin-right:10px}.detailhead{align-items:start;flex-direction:column}.notes{grid-template-columns:1fr}.metrics{gap:16px}.grid{grid-template-columns:1fr}.tab{min-width:130px}.canvas img{max-height:none}}
</style></head>
<body>
<div class="mobileBrand"><strong>SaaS Atlas</strong> · Visual UX Library</div><div id="app"></div>
<div class="modal" id="modal" aria-hidden="true"><div class="modalhead"><strong id="modalTitle"></strong><button id="closeModal" aria-label="Закрыть">×</button></div><img id="modalImg" alt="Увеличенный скриншот"></div>
<script src="./catalog.js"></script>
<script>
(function(){
"use strict";
var d=window.SAAS_ATLAS,root=document.getElementById("app");
if(!d){root.textContent="Не удалось загрузить проверенные данные каталога.";return;}
var all=d.patterns,products=d.products,ids=all.map(function(x){return x.id}),p=new URLSearchParams(location.search);
var st={id:ids.indexOf(p.get("pattern"))>=0?p.get("pattern"):null,product:null,tag:"Все",search:"",favs:false,focus:false};
var saved=[];try{saved=JSON.parse(localStorage.getItem("saasAtlasSaved")||"[]")}catch(e){}
function e(s){return String(s===undefined?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function path(id){return location.pathname+"?pattern="+encodeURIComponent(id)}
function im(x){return "./"+x.image_local}
function current(){return all.find(function(x){return x.id===st.id})}
function findProd(name){return products.find(function(x){return x.name===name})}
function src(x){return x.source_url||x.image_url}
function side(){var out='<aside class="sidebar"><div class="brand" data-home="1"><span class="mark">≡</span><span><b>SaaS Atlas</b><small>VISUAL UX LIBRARY</small></span></div><div class="sidehead">Коллекция</div>';
out+='<button class="sidebtn '+(!st.product&&!st.id?"active":"")+'" data-home="1">Все паттерны <span class="count">'+all.length+'</span></button><button class="sidebtn '+(st.favs?"active":"")+'" data-favs="1">Избранное <span class="count">'+saved.length+'</span></button><div class="sidehead">SaaS-продукты</div>';
products.forEach(function(p){out+='<button class="sidebtn '+(st.product===p.id?"active":"")+'" data-product="'+e(p.id)+'">'+e(p.name)+' <span class="count">'+p.pattern_ids.length+'</span></button>'});
return out+'<div class="sidefoot">Реальные продуктовые скриншоты<br>Файлы проверены и размещены локально<br>Исторические состояния помечены годом</div></aside>'}
function top(){return '<div class="top"><span>Референс-библиотека / <b style="color:#5c5260">SaaS UX</b></span><div><a href="./catalog.json" target="_blank">JSON для агентов ↗</a><a href="./AGENTS.md" target="_blank">AGENTS.md ↗</a><a href="./validation-report.json" target="_blank">Проверка экранов ↗</a></div></div>'}
function card(x){return '<article class="tile"><div class="preview" data-open="'+e(x.id)+'"><img src="'+e(im(x))+'" alt="'+e(x.product+" — "+x.title)+'" loading="lazy"><span class="labelimg">'+e(x.tag)+'</span></div><div class="tilebody"><div class="tilename"><b>'+e(x.product)+'</b><span>'+e(x.year)+'</span></div><h3>'+e(x.title)+'</h3><p>'+e(x.what)+'</p><div class="tilefoot"><span class="tag">'+e(x.tag)+'</span><button class="btn" data-fav="'+e(x.id)+'">'+(saved.includes(x.id)?"♥":"♡")+'</button><button class="btn" data-open="'+e(x.id)+'">Смотреть →</button></div></div></article>'}
function listing(){var q=st.search.toLowerCase(),items=all.filter(function(x){return (!st.product||((findProd(x.product)||{}).id===st.product))&&(st.tag==="Все"||x.tag===st.tag)&&(!st.favs||saved.includes(x.id))&&(!q||[x.product,x.title,x.tag,x.what,x.why,x.apply].join(" ").toLowerCase().includes(q))});
var tags=["Все"].concat(Array.from(new Set(all.map(function(x){return x.tag}))));
var out='<div class="hero"><div class="eyebrow">CURATED UX REFERENCES / 2026</div><h1>Интерфейсы, которые<br>стоит <em>разобрать.</em></h1><p>Конкретные UX-решения, привязанные к реальным скриншотам. Выбирай паттерн и сразу изучай нужную область изображения вместе с объяснением.</p></div><div class="metrics"><div class="metric"><b>'+products.length+'</b><small>продуктов</small></div><div class="metric"><b>'+all.length+'</b><small>проверенных экранов</small></div><div class="metric"><b>'+all.filter(function(x){return Number(x.year)>=2025}).length+'</b><small>скриншотов 2025–26</small></div></div>';
out+='<div class="controls"><input id="search" class="search" type="search" placeholder="Найти продукт или UX-паттерн…" value="'+e(st.search)+'"><button class="btn" data-home="1">Сбросить фильтры</button></div><div class="chips">'+tags.map(function(t){return '<button class="chip '+(st.tag===t?"active":"")+'" data-tag="'+e(t)+'">'+e(t)+'</button>'}).join("")+'</div>';
out+='<div class="eyebrow" style="margin-bottom:14px">НАЙДЕНО '+items.length+'</div>'+(items.length?'<div class="grid">'+items.map(card).join("")+'</div>':'<div class="none">По этому запросу ничего не найдено.</div>');
return out}
function detail(){var x=current();if(!x)return listing();var same=all.filter(function(y){return y.product===x.product}),ix=same.indexOf(x),i=ix+1;
var out='<div class="crumb"><button data-home="1">Все референсы</button> / '+e(x.product)+' / '+e(x.title)+'</div><div class="detailhead"><div><div class="eyebrow">'+e(x.product)+' / '+e(x.tag)+'</div><h1>'+e(x.title)+'</h1><p>Экран '+i+' из '+same.length+' · '+e(x.year)+' · '+(x.origin==="official"?"официальная документация":"архивный интерфейс")+'</p></div><div class="actions"><button class="btn" data-fav="'+e(x.id)+'">'+(saved.includes(x.id)?"♥ В избранном":"♡ Сохранить")+'</button><button class="btn primary" data-share="'+e(x.id)+'">↗ Поделиться</button></div></div>';
out+='<div class="tabs">'+same.map(function(y,j){return '<button class="tab '+(y.id===x.id?"active":"")+'" data-open="'+e(y.id)+'"><small>0'+(j+1)+'</small>'+e(y.title)+'</button>'}).join("")+'</div>';
out+='<div class="detailgrid"><div><section class="viewer"><div class="vhead"><strong>Реальный интерфейс / '+e(x.tag)+'</strong><div class="actions"><button class="btn" data-focus="1">'+(st.focus?"Скрыть выделение":"Выделить область")+'</button><button class="btn" data-zoom="1">⤢ Крупнее</button></div></div><div class="canvas"><img src="'+e(im(x))+'" id="bigshot" alt="'+e(x.product+" — "+x.title)+'">'+(st.focus?'<div class="focus '+e(x.focus||"center")+'"></div>':"")+'</div><div class="caption"><span>'+e(x.note||"Реальный экран продукта")+'</span><a href="'+e(src(x))+'" rel="noopener noreferrer" target="_blank">Первоисточник ↗</a></div></section>';
out+='<div class="pager"><button class="btn" '+(ix===0?"disabled":"")+' data-open="'+e(same[Math.max(0,ix-1)].id)+'">← Предыдущий</button><span class="small">'+i+' / '+same.length+'</span><button class="btn" '+(ix===same.length-1?"disabled":"")+' data-open="'+e(same[Math.min(same.length-1,ix+1)].id)+'">Следующий →</button></div></div>';
out+='<div class="notes"><div class="note first"><div class="eyebrow">На что смотреть</div><h3>'+e(x.what)+'</h3><p>'+e(x.why)+'</p></div><div class="note"><div class="eyebrow">Где применить</div><p>'+e(x.apply)+'</p></div><div class="note"><div class="eyebrow">Контекст / ограничения</div><p>'+e(x.note)+' '+(x.origin==="archive"?"Это исторический экран, а не текущая версия продукта.":"Точная дата захвата может отличаться от даты публикации.")+'</p></div><div class="note"><div class="eyebrow">Для AI-агента</div><p>Постоянный ID: <code>'+e(x.id)+'</code>. Открой JSON или скопируй контекст и ссылку на этот пример.</p><p><button class="btn" data-agent="'+e(x.id)+'">Скопировать контекст ↗</button></p></div></div></div>';
return out+'<p class="notice">Изображения принадлежат правообладателям. Публикуются для сравнительного UX-анализа и комментария; год и источник указаны для каждого скриншота.</p>'}
function render(){root.innerHTML=side()+'<main class="main">'+top()+(st.id?detail():listing())+'<div class="footer">SaaS Atlas · Visual UX Research · <a href="./catalog.json">JSON</a> · <a href="./AGENTS.md">Agent guide</a> · <a href="./validation-report.json">Validation report</a></div></main>';
var s=document.getElementById("search");if(s)s.addEventListener("input",function(){var pos=s.selectionStart;st.search=s.value;render();var ns=document.getElementById("search");ns.focus();ns.setSelectionRange(pos,pos)})}
function navigate(id){st.id=id;st.focus=false;history.pushState({},'',id?path(id):location.pathname);window.scrollTo(0,0);render()}
function copy(s){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(function(){alert("Скопировано")}).catch(function(){prompt("Скопируй текст",s)});else prompt("Скопируй текст",s)}
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-home],[data-open],[data-product],[data-tag],[data-fav],[data-favs],[data-focus],[data-zoom],[data-share],[data-agent]");if(!b)return;var z=b.dataset;
if(z.home){st.id=null;st.product=null;st.tag="Все";st.favs=false;st.search="";navigate(null)}
else if(z.open){navigate(z.open)}
else if(z.product){st.id=null;st.product=z.product;st.favs=false;st.tag="Все";navigate(null)}
else if(z.tag){st.tag=z.tag;render()}
else if(z.fav){saved=saved.includes(z.fav)?saved.filter(function(a){return a!==z.fav}):saved.concat(z.fav);localStorage.setItem("saasAtlasSaved",JSON.stringify(saved));render()}
else if(z.favs){st.id=null;st.product=null;st.favs=!st.favs;navigate(null)}
else if(z.focus){st.focus=!st.focus;render()}
else if(z.zoom){var x=current();if(x){document.getElementById("modalTitle").textContent=x.product+" / "+x.title;document.getElementById("modalImg").src=im(x);document.getElementById("modal").classList.add("show")}}
else if(z.share){copy(location.origin+path(z.share))}
else if(z.agent){var x=current();copy("SaaS UX reference: "+x.product+" — "+x.title+"\nPattern: "+x.tag+"\nWhat to inspect: "+x.what+"\nWhy: "+x.why+"\nApply: "+x.apply+"\nYear: "+x.year+"\nSource: "+src(x)+"\nImage: "+new URL(im(x),location.href).href+"\nPattern: "+location.origin+path(x.id)+"\nData: "+new URL("./catalog.json",location.href).href)}});
document.getElementById("closeModal").onclick=function(){document.getElementById("modal").classList.remove("show")};
document.getElementById("modal").onclick=function(e){if(e.target.id==="modal")e.currentTarget.classList.remove("show")};
document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("modal").classList.remove("show")});
window.addEventListener("popstate",function(){var u=new URLSearchParams(location.search);st.id=ids.includes(u.get("pattern"))?u.get("pattern"):null;render()});
render();
})();
</script></body></html>
